{% extends "base.html" %}
{% block title %}{% if product %}Edit{% else %}New{% endif %} Product{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto px-4 py-10">
    <h1 class="font-display text-2xl text-ink-900 mb-6">{% if product %}Edit product{% else %}New product{% endif %}</h1>
    
    <form method="post" class="bg-cream-50 border border-cream-200 rounded-xl p-6 space-y-4">
        <div>
            <label class="block text-xs font-medium text-ink-700 mb-1.5">Name</label>
            <input type="text" name="name" required value="{{ product.name if product else '' }}"
                   class="w-full px-4 py-2.5 rounded-lg border border-cream-300 bg-white text-sm focus:outline-none focus:ring-2 focus:ring-sage-400/40">
        </div>
        <div>
            <label class="block text-xs font-medium text-ink-700 mb-1.5">Description</label>
            <textarea name="description" rows="3" required
                      class="w-full px-4 py-2.5 rounded-lg border border-cream-300 bg-white text-sm focus:outline-none focus:ring-2 focus:ring-sage-400/40">{{ product.description if product else '' }}</textarea>
        </div>
        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-xs font-medium text-ink-700 mb-1.5">Price ($)</label>
                <input type="number" name="price" step="0.01" min="0" required value="{{ product.price if product else '' }}"
                       class="w-full px-4 py-2.5 rounded-lg border border-cream-300 bg-white text-sm focus:outline-none focus:ring-2 focus:ring-sage-400/40">
            </div>
            <div>
                <label class="block text-xs font-medium text-ink-700 mb-1.5">Stock</label>
                <input type="number" name="stock" min="0" required value="{{ product.stock if product else 10 }}"
                       class="w-full px-4 py-2.5 rounded-lg border border-cream-300 bg-white text-sm focus:outline-none focus:ring-2 focus:ring-sage-400/40">
            </div>
        </div>
        <div>
            <label class="block text-xs font-medium text-ink-700 mb-1.5">Category</label>
            <select name="category" class="w-full px-4 py-2.5 rounded-lg border border-cream-300 bg-white text-sm focus:outline-none focus:ring-2 focus:ring-sage-400/40">
                {% for cat in categories %}
                <option value="{{ cat }}" {% if product and product.category == cat %}selected{% endif %}>{{ cat }}</option>
                {% endfor %}
            </select>
        </div>
        <div>
            <label class="block text-xs font-medium text-ink-700 mb-1.5">Image URL</label>
            <input type="url" name="image_url" value="{{ product.image_url if product else '' }}"
                   placeholder="https://..."
                   class="w-full px-4 py-2.5 rounded-lg border border-cream-300 bg-white text-sm focus:outline-none focus:ring-2 focus:ring-sage-400/40">
        </div>
        <div class="flex items-center gap-2">
            <input type="checkbox" name="featured" id="featured" {% if product and product.featured %}checked{% endif %}
                   class="rounded border-cream-300 text-sage-500 focus:ring-sage-400">
            <label for="featured" class="text-sm text-ink-700">Featured product</label>
        </div>
        <div class="flex gap-3 pt-2">
            <button type="submit" class="btn-primary text-cream-50 px-6 py-2.5 rounded-full text-sm font-medium">
                {% if product %}Save changes{% else %}Create product{% endif %}
            </button>
            <a href="{{ url_for('admin_products') }}" class="px-6 py-2.5 rounded-full text-sm border border-cream-300 text-ink-700 hover:bg-cream-100">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
