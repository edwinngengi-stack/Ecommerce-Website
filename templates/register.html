{% extends "base.html" %}
{% block title %}Join{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-16">
    <div class="bg-cream-50 border border-cream-200 rounded-2xl p-8 shadow-sm">
        <h1 class="font-display text-2xl text-ink-900 mb-1">Create your account</h1>
        <p class="text-sm text-ink-700/70 mb-6">Sign up to start shopping</p>
        
        <form method="post" class="space-y-4">
            <div>
                <label class="block text-xs font-medium text-ink-700 mb-1.5">Username</label>
                <input type="text" name="username" required autofocus
                       class="w-full px-4 py-2.5 rounded-lg border border-cream-300 bg-white text-sm focus:outline-none focus:ring-2 focus:ring-sage-400/40">
            </div>
            <div>
                <label class="block text-xs font-medium text-ink-700 mb-1.5">Email</label>
                <input type="email" name="email" required
                       class="w-full px-4 py-2.5 rounded-lg border border-cream-300 bg-white text-sm focus:outline-none focus:ring-2 focus:ring-sage-400/40">
            </div>
            <div>
                <label class="block text-xs font-medium text-ink-700 mb-1.5">Password</label>
                <input type="password" name="password" required minlength="6"
                       class="w-full px-4 py-2.5 rounded-lg border border-cream-300 bg-white text-sm focus:outline-none focus:ring-2 focus:ring-sage-400/40">
            </div>
            <button type="submit" class="w-full btn-primary text-cream-50 py-2.5 rounded-lg text-sm font-medium mt-2">
                Create account
            </button>
        </form>
        
        <p class="text-center text-sm text-ink-700/70 mt-6">
            Already have an account? <a href="{{ url_for('login') }}" class="text-sage-600 hover:text-sage-700">Sign in</a>
        </p>
    </div>
</div>
{% endblock %}
