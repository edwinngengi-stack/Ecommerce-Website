{% extends "base.html" %}
{% block title %}Account settings{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto px-4 sm:px-6 py-10">
    <div class="bg-cream-50 border border-cream-200 rounded-2xl p-6 sm:p-8">
        <h1 class="font-display text-3xl text-ink-900 mb-2">Account settings</h1>
        <p class="text-sm text-ink-700/70 mb-6">Update your profile and optionally choose a new password.</p>

        <form method="post" class="space-y-4">
            <div>
                <label for="username" class="block text-xs font-medium text-ink-700 mb-1.5">Username</label>
                <input id="username" type="text" name="username" value="{{ current_user.username }}" required maxlength="80"
                       class="w-full px-4 py-2.5 rounded-lg border border-cream-300 bg-white text-sm focus:outline-none focus:ring-2 focus:ring-sage-400/40">
            </div>
            <div>
                <label for="email" class="block text-xs font-medium text-ink-700 mb-1.5">Email</label>
                <input id="email" type="email" name="email" value="{{ current_user.email }}" required maxlength="120"
                       class="w-full px-4 py-2.5 rounded-lg border border-cream-300 bg-white text-sm focus:outline-none focus:ring-2 focus:ring-sage-400/40">
            </div>
            <div class="border-t border-cream-200 pt-4">
                <h2 class="font-medium text-ink-900 mb-3">Change password</h2>
                <div class="space-y-4">
                    <div>
                        <label for="current_password" class="block text-xs font-medium text-ink-700 mb-1.5">Current password</label>
                        <input id="current_password" type="password" name="current_password" autocomplete="current-password"
                               class="w-full px-4 py-2.5 rounded-lg border border-cream-300 bg-white text-sm focus:outline-none focus:ring-2 focus:ring-sage-400/40">
                    </div>
                    <div>
                        <label for="new_password" class="block text-xs font-medium text-ink-700 mb-1.5">New password</label>
                        <input id="new_password" type="password" name="new_password" minlength="6" autocomplete="new-password"
                               class="w-full px-4 py-2.5 rounded-lg border border-cream-300 bg-white text-sm focus:outline-none focus:ring-2 focus:ring-sage-400/40">
                    </div>
                </div>
            </div>
            <button type="submit" class="w-full btn-primary text-cream-50 py-3 rounded-full text-sm font-medium">
                Save changes
            </button>
        </form>
    </div>
</div>
{% endblock %}
