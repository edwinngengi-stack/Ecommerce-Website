{% extends "base.html" %}
{% block title %}Sign in{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-16">
    <div class="bg-cream-50 border border-cream-200 rounded-2xl p-8 shadow-sm">
        <h1 class="font-display text-2xl text-ink-900 mb-1">Welcome back</h1>
        <p class="text-sm text-ink-700/70 mb-6">Sign in to your account</p>
        
        <form method="post" class="space-y-4">
            <div>
                <label class="block text-xs font-medium text-ink-700 mb-1.5">Username</label>
                <input type="text" name="username" required autofocus
                       class="w-full px-4 py-2.5 rounded-lg border border-cream-300 bg-white text-sm focus:outline-none focus:ring-2 focus:ring-sage-400/40">
            </div>
            <div>
                <label class="block text-xs font-medium text-ink-700 mb-1.5">Password</label>
                <input type="password" name="password" required
                       class="w-full px-4 py-2.5 rounded-lg border border-cream-300 bg-white text-sm focus:outline-none focus:ring-2 focus:ring-sage-400/40">
            </div>
            <button type="submit" class="w-full btn-primary text-cream-50 py-2.5 rounded-lg text-sm font-medium mt-2">
                Sign in
            </button>
        </form>
        
        <p class="text-center text-sm text-ink-700/70 mt-6">
            New here? <a href="{{ url_for('register') }}" class="text-sage-600 hover:text-sage-700">Create an account</a>
        </p>
        <div class="mt-6 pt-4 border-t border-cream-200 text-xs text-ink-700/50 text-center">
            Demo: <code class="bg-cream-200 px-1 rounded">demo</code> / <code class="bg-cream-200 px-1 rounded">demo123</code><br>
            Admin: <code class="bg-cream-200 px-1 rounded">admin</code> / <code class="bg-cream-200 px-1 rounded">admin123</code>
        </div>
    </div>
</div>
{% endblock %}
